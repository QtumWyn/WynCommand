[main]

# Razer releases modifiers before emitting F13-F18.
# Latch them briefly so the macro layer survives that release.

leftshift = oneshot(shift)
rightshift = oneshot(shift)

leftcontrol = oneshot(control)
rightcontrol = oneshot(control)

leftalt = oneshot(alt)

# Plain M1-M6
f13 = f13
f14 = f14
f15 = f15
f16 = f16
f17 = f17
f18 = f18


