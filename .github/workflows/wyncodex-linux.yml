name: WynCodex Linux

on:
  push:
    branches: [main, 'release/wyncodex-*']
    paths: ['M1-wyncodex-python/**', '.github/workflows/wyncodex-linux.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: M1-wyncodex-python
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libdbus-1-3 libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1
          python -m pip install -r requirements-build.txt
      - name: Test database preservation and UI
        run: python -B -m unittest discover -s tests -v
      - name: Build Linux application and library downloads
        run: python scripts/build_release.py
      - name: Smoke test packaged application
        run: python scripts/smoke_bundle.py dist/WynCodex/WynCodex
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wyncodex-linux-release
          path: M1-wyncodex-python/dist/release/*
          if-no-files-found: error
          retention-days: 14
