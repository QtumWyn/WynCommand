[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wyncodex"
version = "0.1.0"
description = "Implementation-focused developer knowledge encyclopedia for WynCommand."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "Pygments>=2.18,<3",
]

[project.scripts]
wyncodex = "wyncodex.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wyncodex = ["database/migrations/*.sql"]